apiVersion: v1
kind: ServiceAccount
metadata:
  name: payouts
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payouts-callers
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
data:
  callers.json: |
    {
      "svc-workspace": [
        "ApproveBatch",
        "CreateBatch",
        "GetBatch"
      ]
    }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payouts-tls
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
spec:
  secretName: payouts-tls
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  uris:
  - spiffe://forge/svc/svc-payouts
  dnsNames:
  - payouts.forge.svc.cluster.local
  usages:
  - server auth
  - client auth
  - digital signature
  issuerRef:
    name: forge-service-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payouts
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: payouts
      app.kubernetes.io/part-of: forge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payouts
        app.kubernetes.io/part-of: forge
    spec:
      serviceAccountName: payouts
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: payouts
            app.kubernetes.io/part-of: forge
      containers:
      - name: payouts
        image: registry.PLACEHOLDER/forge/payouts-service:TAG
        ports:
        - name: https
          containerPort: 8200
        - name: health
          containerPort: 8181
        env:
        - name: FORGE_ENV
          value: production
        - name: HEALTH_ADDR
          value: :8181
        - name: PAYOUTS_ADDR
          value: :8200
        - name: TLS_CERT_FILE
          value: /tls/tls.crt
        - name: TLS_KEY_FILE
          value: /tls/tls.key
        - name: TLS_CA_FILE
          value: /tls/ca.crt
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.forge-observability.svc.cluster.local:4318
        - name: KAFKA_BROKERS
          value: PLACEHOLDER-kafka-bootstrap.forge-data.svc.cluster.local:9093
        - name: DATABASE_URL_FILE
          value: /secrets/DATABASE_URL
        - name: TEMPORAL_HOST
          value: PLACEHOLDER-temporal-frontend.forge-data.svc.cluster.local:7233
        - name: PAYMENTS_PUBLISHER
          value: kafka
        - name: PAYOUTS_CALLERS_FILE
          value: /config/callers.json
        - name: TEMPORAL_NAMESPACE
          value: default
        - name: TEMPORAL_TASK_QUEUE
          value: payouts
        - name: PAYMENTS_URL
          value: https://payments.forge.svc.cluster.local:8085
        - name: CONSOLIDATED_URL
          value: https://consolidated.forge.svc.cluster.local:8096
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 2
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: callers
          mountPath: /config
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: callers
        configMap:
          name: payouts-callers
      - name: tls
        secret:
          secretName: payouts-tls
      - name: secrets
        secret:
          secretName: payouts-secrets
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payouts
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
spec:
  selector:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
  ports:
  - name: https
    port: 8200
    targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payouts
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payouts
      app.kubernetes.io/part-of: forge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payouts
  namespace: forge
  labels:
    app.kubernetes.io/name: payouts
    app.kubernetes.io/part-of: forge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payouts
      app.kubernetes.io/part-of: forge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workspace
    ports:
    - protocol: TCP
      port: 8200
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: forge-observability
    ports:
    - protocol: TCP
      port: 4318
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: forge-data
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 9093
    - protocol: TCP
      port: 7233
    - protocol: TCP
      port: 3001
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: consolidated
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: payments
    ports:
    - protocol: TCP
      port: 8096
    - protocol: TCP
      port: 8085
