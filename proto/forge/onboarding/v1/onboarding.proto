// Onboarding API (ARCHITECTURE.md 11.3). Each onboarding is a Temporal workflow.
syntax = "proto3";

package forge.onboarding.v1;

option go_package = "github.com/khayaai/forge-mutual/pkg/api/forge/onboarding/v1;onboardingv1";

service OnboardingService {
  rpc StartBusinessOnboarding(StartBusinessOnboardingRequest) returns (StartBusinessOnboardingResponse);
  // StartPersonOnboarding onboards one individual: identity verification, screening, and a personal ZAR account.
  rpc StartPersonOnboarding(StartPersonOnboardingRequest) returns (StartPersonOnboardingResponse);
  // FindApplication returns the application a signed-in applicant made, of the given kind. NotFound if there is none.
  rpc FindApplication(FindApplicationRequest) returns (FindApplicationResponse);
  rpc GetOnboarding(GetOnboardingRequest) returns (GetOnboardingResponse);
  // ListKYCReviews lists the verifications a person must decide. Open reviews are oldest first.
  rpc ListKYCReviews(ListKYCReviewsRequest) returns (ListKYCReviewsResponse);
  // DecideKYCReview records a person's decision on a review and resumes the onboarding. The reviewer must give a note.
  rpc DecideKYCReview(DecideKYCReviewRequest) returns (DecideKYCReviewResponse);
  // Opens a further current account in a currency for an active customer: the rand, the dollar, the euro or the
  // pound. One per currency per party; asking again returns the same account.
  rpc OpenCurrencyAccount(OpenCurrencyAccountRequest) returns (OpenCurrencyAccountResponse);
}

message Director {
  string legal_name = 1;
  string national_id = 2;
  uint32 ownership_bps = 3; // 0 to 10000; zero for directors with no shares
  bool is_ubo = 4;          // ultimate beneficial owner
}

message StartBusinessOnboardingRequest {
  string idempotency_key = 1;
  string legal_name = 2;
  string registration_number = 3;
  string country = 4;
  string sector_code = 5;
  repeated Director directors = 6;
  string actor = 7;
  // The identity provider's subject of the person who applied, when the application came through the customer
  // front door. With it, the onboarding is keyed to the applicant (one business application each) and
  // idempotency_key is ignored.
  string applicant_subject = 8;
}
message StartPersonOnboardingRequest {
  string idempotency_key = 1; // ignored when applicant_subject is set
  string legal_name = 2;
  string national_id = 3;     // South African identity number, 13 digits
  string country = 4;
  string actor = 5;
  string applicant_subject = 6;
}
message StartPersonOnboardingResponse {
  string onboarding_id = 1;
}
message FindApplicationRequest {
  string applicant_subject = 1;
  string kind = 2; // "business" or "person"
}
message FindApplicationResponse {
  OnboardingStatus status = 1;
}

message StartBusinessOnboardingResponse {
  string onboarding_id = 1;
}

message GetOnboardingRequest {
  string onboarding_id = 1;
}

enum OnboardingState {
  ONBOARDING_STATE_UNSPECIFIED = 0;
  ONBOARDING_STATE_RUNNING = 1;
  ONBOARDING_STATE_COMPLETED = 2;
  ONBOARDING_STATE_DECLINED = 3;
  ONBOARDING_STATE_FAILED = 4; // an unexpected error stopped the workflow; retry or inspect
}

message OnboardingStatus {
  string onboarding_id = 1;
  OnboardingState state = 2;
  string company_party_id = 3;
  repeated string person_party_ids = 4;
  repeated string account_ids = 5;
  string tier = 6;
  string decline_reason = 7;
  repeated string steps = 8; // steps completed so far, in order
  // The hosted pages where each subject completes their verification, once they have been started. A link is a
  // bearer link: whoever has it can complete that verification, so it is given only to the person it is for.
  repeated VerificationLink verification_links = 9;
  string kind = 10; // "business" or "person"
}

// VerificationLink is one subject's verification with the identity provider.
message VerificationLink {
  string subject_party_id = 1;
  string kind = 2;       // "business" or "person"
  string session_id = 3; // the provider's session
  string url = 4;        // the hosted page; empty for a provider with none
}

message GetOnboardingResponse {
  OnboardingStatus status = 1;
}

message KYCReview {
  string review_id = 1;
  string onboarding_id = 2;
  string subject_party_id = 3;
  string reason = 4;
  string status = 5;       // OPEN or DECIDED
  string opened_at = 6;    // RFC 3339
  string decision = 7;     // APPROVED or DECLINED once decided
  string reviewer = 8;
  string note = 9;
  string decided_at = 10;  // RFC 3339
}

message ListKYCReviewsRequest {
  bool open_only = 1;
}

message ListKYCReviewsResponse {
  repeated KYCReview reviews = 1;
}

message DecideKYCReviewRequest {
  string review_id = 1;
  string decision = 2; // APPROVED or DECLINED
  string reviewer = 3;
  string note = 4;     // at least 20 characters: what was checked and why
}

message DecideKYCReviewResponse {
  KYCReview review = 1;
}

message OpenCurrencyAccountRequest {
  string party_id = 1;
  string asset = 2; // ZAR, USD, EUR or GBP
  string actor = 3;
}

message OpenCurrencyAccountResponse {
  string account_id = 1;
  string asset = 2;
  // How a payer pays into the account: the reference to quote, and for a foreign currency the partner bank that
  // holds it. Bank account details beyond these come from the partner (VERIFY-PARTNER).
  string reference = 3;
  string partner = 4;
}
