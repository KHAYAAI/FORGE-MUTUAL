syntax = "proto3";

package forge.offers.v1;

option go_package = "github.com/khayaai/forge-mutual/pkg/api/forge/offers/v1;offersv1";

// Third-party offers: investments and crypto-asset services that a licensed provider supplies, and Forge only introduces.
//
// THE RULE THIS SERVICE EXISTS TO ENFORCE: every product here is provided, licensed and monitored by a third party,
// never by Forge Mutual. Forge does not provide it, advise on it, hold the customer's money or assets in it, or guarantee
// it. The statement saying so is generated from the provider's verified licence by code, not typed by hand, it accompanies
// every offer, and a customer must acknowledge it (by its hash) before a referral is made. A product whose provider's
// licence has not been verified in the last 12 months is not shown at all.
//
// Status: built, tested, OFF by default (PARTNER_OFFERS_ENABLED) and off in production until FORGE_APPROVAL_PARTNER_OFFERS
// names the approving decision (pkg/licence). Wired to the customer app through workspace-api but not configured, so off. No provider is chosen.
service PartnerOffersService {
  // ListOffers returns the offers a party may see, each with its mandatory statement. Hidden: any offer whose provider is
  // not active, whose licence is unverified, stale or expired, or whose own status is not active.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  // CreateReferral records that the party read and acknowledged the statement and consented to share their details with the
  // provider, and returns the provider's own address where the party continues. Forge takes no money and gives no advice.
  rpc CreateReferral(CreateReferralRequest) returns (CreateReferralResponse);
  rpc ListReferrals(ListReferralsRequest) returns (ListReferralsResponse);
}

// Compliance's side. Registering a provider and verifying its licence are two different people.
service PartnerAdminService {
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
  // VerifyLicence records that someone other than the registrant checked the licence on the regulator's own register.
  rpc VerifyLicence(VerifyLicenceRequest) returns (VerifyLicenceResponse);
  rpc SuspendProvider(SuspendProviderRequest) returns (SuspendProviderResponse);
  rpc UpsertOffer(UpsertOfferRequest) returns (UpsertOfferResponse);
  rpc SetOfferStatus(SetOfferStatusRequest) returns (SetOfferStatusResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Every offer, drafts and withdrawn included, with the statement a customer would be shown, so a second person can read it before switching it on.
  rpc ListAdminOffers(ListAdminOffersRequest) returns (ListAdminOffersResponse);
  // Every referral with whether the customer's details were sent, and the referral fees recorded against it.
  rpc ListAdminReferrals(ListAdminReferralsRequest) returns (ListAdminReferralsResponse);
  // Books a referral fee the provider paid, as income, against the bank receipt. Two people: the first call proposes it, a call from a DIFFERENT
  // person with the same referral, amount and bank reference books it. Never more than the offer's cap; once per bank reference.
  rpc RecordReferralFee(RecordReferralFeeRequest) returns (RecordReferralFeeResponse);
}

message Offer {
  string offer_id = 1;
  string category = 2;   // INVESTMENTS or CRYPTO_ASSETS
  string title = 3;
  string summary = 4;
  string provider_name = 5;
  string licence_type = 6;   // FSP or CASP
  string licence_number = 7;
  string regulator = 8;      // for example "FSCA"
  string statement = 9;      // the mandatory third-party statement, generated; show it in full
  string statement_hash = 10; // sent back in CreateReferral to prove this exact text was acknowledged
  string fee_disclosure = 11;
  string referral_fee_cap_minor = 13; // the most Forge may be paid for introducing a customer to this product; "0" means nothing
  repeated string shares = 14;        // exactly what Forge sends the provider if the customer consents: the same list the sender uses
  string provider_id = 12;   // for the consent a referral needs (purpose share_with_partner, scope referral:<provider_id>)
}

message ListOffersRequest {
  string party_id = 1;
  string category = 2; // optional filter
}
message ListOffersResponse { repeated Offer offers = 1; }

message CreateReferralRequest {
  string idempotency_key = 1;
  string party_id = 2;
  string offer_id = 3;
  bool acknowledged_third_party = 4; // must be true
  string statement_hash = 5;         // must match the offer's current statement
}
message Referral {
  string referral_id = 1;
  string offer_id = 2;
  string provider_name = 3;
  string handoff_url = 4; // the provider's address; carries the referral id and nothing personal
  string created_at = 5;
}
message CreateReferralResponse { Referral referral = 1; }

message ListReferralsRequest { string party_id = 1; }
message ListReferralsResponse { repeated Referral referrals = 1; }

message RegisterProviderRequest {
  string provider_id = 1;
  string name = 2;
  string licence_type = 3;  // FSP or CASP
  string regulator = 4;
  string licence_number = 5;
  string licence_source_url = 6; // the regulator's register entry, https
  string actor = 7;
  string delivery_url = 8;       // where Forge sends a referred customer's details (https, the provider's own domain); empty: nothing is sent
}
message Provider {
  string provider_id = 1;
  string name = 2;
  string licence_type = 3;
  string regulator = 4;
  string licence_number = 5;
  string status = 6;               // PENDING, ACTIVE, SUSPENDED or WITHDRAWN
  string licence_verified_at = 7;
  string licence_verified_by = 8;
  string licence_expires_at = 9;
  string licence_checked_at = 10;  // the last automatic check against the regulator's register extract
  bool delivery_configured = 11;   // Forge can send this provider referred customers' details
}
message RegisterProviderResponse { Provider provider = 1; }

message VerifyLicenceRequest {
  string provider_id = 1;
  string actor = 2;
  string licence_expires_at = 3; // RFC 3339 date; empty if the register shows no expiry
}
message VerifyLicenceResponse { Provider provider = 1; }

message SuspendProviderRequest {
  string provider_id = 1;
  string reason = 2;
  string actor = 3;
}
message SuspendProviderResponse { Provider provider = 1; }

message UpsertOfferRequest {
  string offer_id = 1;
  string provider_id = 2;
  string category = 3;
  string title = 4;
  string summary = 5;
  string handoff_url = 6;      // https, on the provider's own domain
  string fee_disclosure = 7;   // optional note on how a fee is worked out; the statement's fee sentence is generated from the cap
  string actor = 8;
  string referral_fee_cap_minor = 9; // required: the most Forge may be paid per referral, rand cents; "0" means Forge is paid nothing
}
message UpsertOfferResponse { Offer offer = 1; }

message SetOfferStatusRequest {
  string offer_id = 1;
  string status = 2; // ACTIVE or WITHDRAWN
  string actor = 3;
}
message SetOfferStatusResponse { string status = 1; }

message ListProvidersRequest {}
message ListProvidersResponse { repeated Provider providers = 1; }

message AdminOffer {
  Offer offer = 1;            // with the generated statement and its hash
  string status = 2;          // DRAFT, ACTIVE or WITHDRAWN
  string handoff_url = 3;
  string updated_by = 4;
  string updated_at = 5;
  bool visible_now = 6;       // would a customer see it right now (provider verified within 12 months, offer active)
}

message ListAdminOffersRequest {}
message ListAdminOffersResponse { repeated AdminOffer offers = 1; }

message AdminReferral {
  string referral_id = 1;
  string offer_id = 2;
  string offer_title = 3;
  string provider_id = 4;
  string provider_name = 5;
  string party_id = 6;
  string created_at = 7;
  string delivery_status = 8;     // PENDING, SENT, FAILED, CANCELLED or NOT_CONFIGURED
  string delivery_detail = 9;     // why, for FAILED and CANCELLED; never the details themselves
  string delivered_at = 10;
  string fee_cap_minor = 11;
  string fees_recorded_minor = 12;
}

message ListAdminReferralsRequest {}
message ListAdminReferralsResponse { repeated AdminReferral referrals = 1; }

message RecordReferralFeeRequest {
  string referral_id = 1;
  string amount_minor = 2;        // rand cents
  string bank_reference = 3;      // the line on the sponsor bank statement the provider's payment arrived on; each is booked once
  string officer = 4;             // the person making this call; the second call must come from someone else
  reserved 5;
}
message ReferralFee {
  string referral_id = 1;
  string amount_minor = 2;
  string bank_reference = 3;
  string recorded_by = 4;
  string approved_by = 5;
  string recorded_at = 6;
}
message RecordReferralFeeResponse {
  ReferralFee fee = 1;                 // set once booked
  bool awaiting_second_person = 2;     // proposed, not yet booked
}
